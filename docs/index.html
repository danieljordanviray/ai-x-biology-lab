body { font-family: -apple-system, Georgia, serif; max-width: 760px; margin: 0 auto;

a { color: #1f6feb; }

.scroller .posts::-webkit-scrollbar { width: 8px; }
.scroller .posts::-webkit-scrollbar-thumb { background: #c3c9d1; border-radius: 4px; }
.scroller .fade { position: absolute; left: 0; right: 14px; bottom: 0; height: 46px; background: linear-gradient(to bottom, rgba(255,255,255,0), #fff); pointer-events: none; }
@media (max-width: 640px) { .scroller .posts { max-height: 640px; } }
.scroller.fits .posts { max-height: none; overflow-y: visible; }
.scroller.fits .fade { display: none; }
section.fits .navbtns { visibility: hidden; }
.scroller.expanded .posts { max-height: none; overflow-y: visible; }
.scroller.expanded .fade { display: none; }
.secfoot { display: flex; justify-content: space-between; align-items: baseline; margin: .45em 0 0; }

.post { margin: 1em 0; }
.post a.title { font-size: 1.1em; font-weight: 600; text-decoration: none; }
.post a.title:hover { text-decoration: underline; }
.post p { margin: 4px 0; color: #333; }
.soon { color: #888; font-style: italic; }
.hidden { display: none; }
#noresults { display: none; color: #555; margin-top: 2em; }
.seeall { margin: 0; }
.seeall a { font-weight: 600; text-decoration: none; }
.seeall a:hover { text-decoration: underline; }
.post { display: flex; gap: 14px; align-items: flex-start; }
.post .thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex: none;
               border: 1px solid #e0e4ec; box-shadow: 0 1px 3px rgba(28,28,40,.10); margin-top: 3px; }
.post .txt { min-width: 0; }
